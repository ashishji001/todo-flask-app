<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit • TodoMaster</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
     <nav class="top-nav">
        <div class="brand" aria-label="TodoMaster">
            <div class="brand-badge" aria-hidden="true">✅</div>
            <div class="brand-text">
                <div class="brand-title">TodoMaster</div>
                <div class="brand-sub">Fast • Clean • Focus</div>
            </div>
        </div>

        <div class="nav-actions">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off" />
            </div>

            <button id="themeToggle" aria-label="Toggle theme" type="button" class="theme-btn">
                🌙
            </button>

            <div class="auth-nav">
                {% include 'partials/auth_links.html' %}
            </div>
        </div>
    </nav>
    <div class="edit-page">
        <div class="edit-card">
            <h1>Edit Task</h1>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="edit-form">
                <input
                    type="text"
                    name="task"
                    value="{{ todo.task }}"
                    required
                    maxlength="200"
                />
                <div class="edit-actions">
                    <button type="submit" class="btn-primary">Update</button>
                    <a class="btn" href="/">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
