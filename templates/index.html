<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoMaster</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav class="top-nav">
        <div class="brand" aria-label="TodoMaster">
            <div class="brand-badge" aria-hidden="true">✅</div>
            <div class="brand-text">
                <div class="brand-title">TodoMaster</div>
                <div class="brand-sub">Fast • Clean • Focus</div>
            </div>
        </div>

        <div class="nav-actions">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off" />
            </div>

            <button id="themeToggle" aria-label="Toggle theme" type="button" class="theme-btn">
                🌙
            </button>

            <div class="auth-nav">
                {% include 'partials/auth_links.html' %}
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>My Tasks</h1>
            <p class="subtitle">Stay on track—add, search, edit, and delete in seconds.</p>
        </header>

        <form method="POST" class="todo-form" autocomplete="off">
            <input
                type="text"
                name="task"
                placeholder="Enter a new task"
                required
                maxlength="200"
            />
            <button type="submit">Add Task</button>
        </form>

        <div class="task-list-wrap">
            <ul id="taskList">
                {% for task in tasks %}
                <li class="task-item">
                    <span class="task-text">{{ task.task }}</span>
                    <div class="task-actions">
                        <a href="/edit/{{ task.id }}" class="edit-link" aria-label="Edit task">Edit</a>
                        <a href="/delete/{{ task.id }}" class="delete-link" aria-label="Delete task">Delete</a>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
